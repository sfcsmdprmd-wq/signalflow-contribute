<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061018">
<title>SignalFlow Contribution Inbox</title>
<style>
:root{--bg:#061018;--card:#0d1d27;--line:#1d3441;--muted:#9eb0ba;--red:#ef3340;--green:#36d18b;--amber:#ffb52e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#061018,#09141c);color:#fff;font:15px system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:640px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#91a4af;font-weight:800}.brand{font-size:21px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--red)}.demo{font-size:11px;border:1px solid #4c5d67;border-radius:999px;padding:5px 9px;color:#c9d3d9}
h1{font-size:28px;margin:5px 0}.intro{color:var(--muted);margin:0 0 18px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:13px}.tabs button{border:1px solid #263d4a;background:#0b1922;color:#b9c6cd;padding:9px 13px;border-radius:999px;white-space:nowrap}.tabs button.on{background:#fff;color:#071018;border-color:#fff;font-weight:800}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0;cursor:pointer}.thumb{width:58px;height:58px;border-radius:11px;background:#142b38;display:grid;place-items:center;font-size:25px}.title{font-weight:800;margin:2px 0 4px}.meta,.desc{font-size:12px;color:var(--muted)}.desc{margin-top:5px;line-height:1.3}.status{font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px;align-self:start}.new{background:#4a1720;color:#ff8b95}.viewed{background:#1c3341;color:#b8d7e7}.used,.delivered{background:#14382c;color:#76e4b4}.chev{color:#6f828d;font-size:20px}
.detail{display:none}.back{background:none;border:0;color:#fff;padding:4px 0 14px;font:inherit}.hero{height:190px;border-radius:18px;background:linear-gradient(135deg,#163442,#0b1a23);display:grid;place-items:center;font-size:68px;border:1px solid var(--line)}.detail h2{font-size:24px;margin:15px 0 5px}.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.facts{line-height:1.9;color:#c5d1d7}.notice{border-left:3px solid var(--green);padding:11px 12px;background:#10271f;border-radius:9px;color:#bcebd7;margin-top:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:1px solid #35505f;background:#172b37;color:#fff;border-radius:11px;padding:13px;font-weight:750}.actions .primary{background:var(--red);border-color:var(--red)}.actions .wide{grid-column:1/-1}.empty{color:var(--muted);padding:25px;text-align:center}.count{font-size:12px;color:#8fa3ae;margin:12px 2px 7px}
</style></head><body><main class="app">
<header><div><div class="eyebrow">SIGNALFLOW</div><div class="brand">CONTRIBUTION <span>INBOX</span></div></div><div class="demo">DEMO</div></header>
<section id="home"><h1>Latest contributions</h1><p class="intro">Recent material sent back to the station.</p><div class="tabs"><button class="on" data-filter="all">All</button><button data-filter="audio">Audio</button><button data-filter="photo">Photos</button><button data-filter="video">Video</button></div><div id="count" class="count"></div><div id="list"></div></section>
<section id="detail" class="detail"><button id="back" class="back">‹ Back to contributions</button><div id="hero" class="hero"></div><h2 id="dtitle"></h2><span id="dstatus" class="status"></span><div class="box"><div id="ddesc"></div><div id="facts" class="facts"></div><div id="notice"></div></div><div id="actions" class="actions"></div></section>
</main><script>
const items=[
{type:'audio',title:'Local News – Council update',who:'Jamie Lee',time:'15:48',status:'Delivered',category:'Local News',desc:'Audio from location for the next local news bulletin.',size:'Audio delivered to playout',playout:true},
{type:'audio',title:'Supporters reaction – post-match',who:'Alex Taylor',time:'15:21',status:'New',category:'Social Media',desc:'Supporter reaction recorded for use across Black Country Radio social channels.',size:'8.7 MB',playout:false},
{type:'photo',title:'Fire at High Street, Dudley',who:'Alex Taylor',time:'14:32',status:'New',category:'Local News',desc:'Six images from the scene. Road closed in both directions.',size:'6 photos · 184 MB'},
{type:'video',title:'RTC – Birmingham New Road',who:'Dan Richards',time:'12:17',status:'Viewed',category:'Travel News',desc:'Video from the scene of a two-car RTC near Tipton Road.',size:'1 video · 84 MB'},
{type:'audio',title:'Interview – Dudley Council',who:'Sam Green',time:'10:08',status:'New',category:'Interviews',desc:'Comments from a council spokesperson regarding this morning’s incident.',size:'5.2 MB',playout:false},
{type:'photo',title:'Community event – Halesowen',who:'Priya Singh',time:'Yesterday 16:45',status:'Used',category:'Features',desc:'Crowds at the community festival in Halesowen.',size:'4 photos · 27 MB'}
];
const icons={audio:'🎙',photo:'📷',video:'▶️'};let filter='all';
function render(){const rows=items.map((x,i)=>({x,i})).filter(o=>filter==='all'||o.x.type===filter);document.getElementById('count').textContent=rows.length+' contribution'+(rows.length===1?'':'s');document.getElementById('list').innerHTML=rows.length?rows.map(({x,i})=>`<article class="item" data-i="${i}"><div class="thumb">${icons[x.type]}</div><div><div class="title">${x.title}</div><div class="meta">${x.who} · ${x.time} · ${x.category}</div><div class="desc">${x.desc}</div></div><div><span class="status ${x.status.toLowerCase()}">${x.status}</span><div class="chev">›</div></div></article>`).join(''):'<div class="empty">No contributions in this filter.</div>';document.querySelectorAll('.item').forEach(r=>r.onclick=()=>openItem(+r.dataset.i))}
function openItem(i){const x=items[i];document.getElementById('home').style.display='none';document.getElementById('detail').style.display='block';document.getElementById('hero').textContent=icons[x.type];document.getElementById('dtitle').textContent=x.title;const s=document.getElementById('dstatus');s.textContent=x.status;s.className='status '+x.status.toLowerCase();document.getElementById('ddesc').textContent=x.desc;document.getElementById('facts').innerHTML='<br>👤 '+x.who+'<br>🕒 '+x.time+'<br>📁 '+x.category+'<br>📎 '+x.size;document.getElementById('notice').innerHTML=x.playout?'<div class="notice"><b>✓ Delivered to Playout</b><br>The audio has been successfully ingested and is no longer stored in the Contribution Inbox.</div>':'<div class="notice"><b>Available in Contribution Inbox</b><br>Original media is retained for 7 days unless you choose Keep longer.</div>';document.getElementById('actions').innerHTML=x.playout?'<button class="wide">✓ Delivery confirmed</button><button class="wide">Mark as used</button>':'<button>▶ Play / Preview</button><button>⇩ Download original</button><button class="primary wide">Prepare for publishing</button><button>Mark as used</button><button>◷ Keep longer</button>'}
document.getElementById('back').onclick=()=>{document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block'};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});render();
</script></body></html>
