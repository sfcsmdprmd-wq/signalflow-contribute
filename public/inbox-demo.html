<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061018">
<title>SignalFlow Contribution Inbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f4f6f8}
.app{max-width:680px;margin:auto;min-height:100vh;background:#fff;padding-bottom:40px}
header{height:86px;background:linear-gradient(135deg,#07141d,#122430);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:11px}.mark{font-size:34px;color:#55e5bd;font-weight:900;transform:rotate(-7deg)}.brand{font-size:21px;font-weight:800;line-height:1.05}.sub{font-size:15px;color:#bdc8cf;margin-top:3px;font-weight:400}.demo{border:1px solid #71818c;border-radius:999px;padding:5px 9px;font-size:10px;color:#d9e0e4}
#home{padding:14px 16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px}.tabs button{height:48px;background:#fff;border:1px solid #d9dfe4;border-radius:12px;color:#17212b;font-size:15px}.tabs button.on{background:#087ff5;border-color:#087ff5;color:#fff;font-weight:700;box-shadow:0 3px 10px #087ff52a}
.sectionhead{display:flex;align-items:center;justify-content:space-between;font-size:18px;color:#59636d;margin:0 2px 11px}.filtericon{font-size:22px;color:#17212b}.count{display:none}
.item{display:grid;grid-template-columns:154px minmax(0,1fr);gap:16px;padding:13px 2px;border-bottom:1px solid #e4e7ea;cursor:pointer;position:relative;min-height:132px}.thumb{height:118px;border-radius:11px;background:linear-gradient(145deg,#c8d6de,#8197a4);display:grid;place-items:center;font-size:38px;overflow:hidden;position:relative}.thumb.photo{background:linear-gradient(145deg,#6f8794,#d45d35)}.thumb.video{background:linear-gradient(145deg,#4d5960,#b9c2c6)}.thumb.audio{background:linear-gradient(135deg,#e9f6ff,#c8e5ff);color:#17314a}.thumb:after{content:"";position:absolute;inset:auto 8px 8px auto;background:#17212bd9;color:#fff;border-radius:6px;padding:3px 6px;font-size:11px}.thumb.video:after{content:"00:28"}.thumb.audio:after{content:"02:34"}.rowtitle{font-size:17px;font-weight:800;padding-right:65px;margin:2px 0 4px;line-height:1.18}.meta{font-size:14px;color:#66717c;margin-bottom:5px}.desc{font-size:14px;color:#56616b;line-height:1.35}.status{position:absolute;right:3px;top:16px;font-size:12px;font-weight:800;border-radius:999px;padding:6px 11px}.new{background:#ffe0e3;color:#e12a37}.viewed{background:#fff0d6;color:#a76500}.used,.delivered{background:#d8f5e9;color:#16825a}
.detail{display:none;background:#fff;min-height:100vh}.detailTop{height:62px;background:#0a1821;color:#fff;display:flex;align-items:center;padding:0 17px;position:sticky;top:0;z-index:11}.back{background:none;border:0;color:#fff;font:16px system-ui;padding:10px 0}.hero{height:300px;background:linear-gradient(145deg,#8799a3,#2b414c);display:grid;place-items:center;font-size:78px}.detailbody{padding:20px}.detail h2{font-size:25px;margin:0 72px 8px 0}.detail .status{top:390px;right:20px}.box{margin:10px 0 0;padding:0;border:0;background:#fff}.facts{font-size:15px;line-height:2;color:#64707b}.notice{border-radius:10px;padding:12px 13px;background:#eef9f5;color:#326756;margin:14px 0}.mediaTitle{font-size:20px;font-weight:800;border-top:1px solid #e5e8eb;padding-top:17px;margin-top:18px}.mediaStrip{display:flex;gap:8px;margin:11px 0 18px}.mini{width:70px;height:58px;border-radius:8px;background:linear-gradient(145deg,#6d8794,#d35c34);border:2px solid #1486f7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:50px;border:1px solid #dbe1e5;background:#fff;color:#17314a;border-radius:11px;font-weight:700;font-size:14px}.actions .primary{background:#087ff5;border-color:#087ff5;color:#fff}.actions .wide{grid-column:1/-1}
@media(max-width:480px){header{height:82px}.item{grid-template-columns:136px 1fr}.thumb{height:108px}.rowtitle{font-size:16px}.desc{font-size:13px}.hero{height:245px}.detail .status{top:332px}.detailbody{padding:18px}}

.thumb{isolation:isolate}.thumb .scene{position:absolute;inset:0;z-index:-1}.thumb.photo .scene,.thumb.video .scene{background:linear-gradient(180deg,#9fc5da 0 43%,#59656b 44% 50%,#8d4d3e 51% 100%)}.thumb.photo .scene:before,.thumb.video .scene:before{content:"";position:absolute;left:9%;bottom:20%;width:26%;height:43%;background:#6e332b;box-shadow:45px -9px 0 #7c4033,88px 3px 0 #60332d}.thumb.photo .scene:after{content:"";position:absolute;left:34%;top:22%;width:48px;height:62px;border-radius:50%;background:radial-gradient(circle at 45% 75%,#ff8b18 0 9%,#ff3d00 10% 21%,#27343a 23% 45%,#53646d 46% 70%,transparent 72%);filter:blur(1px)}.thumb.video .scene:after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border:3px solid #fff;border-radius:50%;background:#14202bbb;color:#fff;display:grid;place-items:center;font-size:19px;padding-left:2px}.thumb.audio .scene{background:linear-gradient(135deg,#eef8ff,#d5eaff)}.thumb.audio .scene:after{content:"▂▅▃▇▄▆▂▅▇▃▆▄▇▂";position:absolute;left:8px;right:8px;top:42%;color:#4b9bd5;font-size:14px;letter-spacing:-1px;white-space:nowrap;overflow:hidden}.typebadge{position:absolute;left:7px;bottom:7px;background:#fff;color:#182731;border-radius:6px;padding:3px 5px;font-size:12px;box-shadow:0 1px 4px #0002}
.hero.photo,.hero.video{position:relative;overflow:hidden;background:linear-gradient(180deg,#a7cadc 0 45%,#59666d 46% 52%,#8d4d3e 53% 100%)}.hero.photo:before,.hero.video:before{content:"";position:absolute;left:5%;bottom:10%;width:25%;height:45%;background:#74372e;box-shadow:110px -18px 0 #814236,220px 5px 0 #67352f}.hero.photo:after{content:"";position:absolute;left:37%;top:15%;width:130px;height:160px;border-radius:50%;background:radial-gradient(circle at 45% 75%,#ffb323 0 8%,#ff3d00 9% 20%,#27343a 23% 43%,#52636c 45% 68%,transparent 70%)}.hero.audio{background:linear-gradient(135deg,#edf8ff,#d5eaff);color:#368bc7}.hero.video:after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border:4px solid #fff;border-radius:50%;background:#14202bbb;color:#fff;display:grid;place-items:center;font-size:28px;padding-left:4px}
.thumb.real{background-size:cover;background-position:center}.thumb.real .scene{display:none}.hero.real{background-size:cover;background-position:center}.hero.real:before,.hero.real:after{display:none}</style></head><body><main class="app">
<header><div class="logo"><div class="mark">ϟ</div><div><div class="brand">SignalFlow</div><div class="sub">Contributions</div></div></div><div class="demo">DEMO</div></header>
<section id="home"><div class="tabs"><button class="on" data-filter="all">All</button><button data-filter="audio">Audio</button><button data-filter="photo">Photos</button><button data-filter="video">Video</button></div><div class="sectionhead"><span>Latest contributions</span><span class="filtericon">☷</span></div><div id="count" class="count"></div><div id="list"></div></section>
<section id="detail" class="detail"><div class="detailTop"><button id="back" class="back">‹ Back</button><div style="margin:auto;font-weight:800">SignalFlow <span style="font-weight:400;color:#bdc8cf">Contributions</span></div></div><div id="hero" class="hero"></div><div class="detailbody"><h2 id="dtitle"></h2><span id="dstatus" class="status"></span><div class="box"><div id="facts" class="facts"></div><div id="ddesc" style="margin:10px 0;line-height:1.45;color:#53606b"></div><div id="notice"></div></div><div class="mediaTitle">Media files</div><div class="mediaStrip"><div class="mini"></div><div class="mini"></div><div class="mini"></div><div class="mini"></div></div><div id="actions" class="actions"></div></div></section>
</main><script>
const items=[
{type:'audio',title:'Local News – Council update',who:'Jamie Lee',time:'15:48',status:'Delivered',category:'Local News',desc:'Audio from location for the next local news bulletin.',size:'Audio delivered to playout',playout:true},
{type:'audio',title:'Supporters reaction – post-match',who:'Alex Taylor',time:'15:21',status:'New',category:'Social Media',desc:'Supporter reaction recorded for use across Black Country Radio social channels.',size:'8.7 MB',playout:false},
{type:'photo',title:'Fire at High Street, Dudley',who:'Alex Taylor',time:'14:32',status:'New',category:'Local News',desc:'Six images from the scene. Road closed in both directions.',size:'6 photos · 184 MB'},
{type:'video',title:'RTC – Birmingham New Road',who:'Dan Richards',time:'12:17',status:'Viewed',category:'Travel News',desc:'Video from the scene of a two-car RTC near Tipton Road.',size:'1 video · 84 MB'},
{type:'audio',title:'Interview – Dudley Council',who:'Sam Green',time:'10:08',status:'New',category:'Interviews',desc:'Comments from a council spokesperson regarding this morning’s incident.',size:'5.2 MB',playout:false},
{type:'photo',title:'Community event – Halesowen',who:'Priya Singh',time:'Yesterday 16:45',status:'Used',category:'Features',desc:'Crowds at the community festival in Halesowen.',size:'4 photos · 27 MB'}
];
const icons={audio:'🎙',photo:'📷',video:'▶️'};
const previews={2:'https://images.unsplash.com/photo-1603899122634-f086ca5f5ddd?auto=format&fit=crop&w=900&q=80',3:'https://s.yimg.com/os/en/manchester_evening_news_792/4f22cbad666e794cdfbca87e12d767eb',5:'https://www.lbhf.gov.uk/sites/default/files/styles/original/public/2024-07/Our%20Place%20launch%20-%20Action%20on%20Disability-1200-tinypng.jpg?itok=SEUzendN'};
let filter='all';
function render(){const rows=items.map((x,i)=>({x,i})).filter(o=>filter==='all'||o.x.type===filter);document.getElementById('count').textContent=rows.length+' contribution'+(rows.length===1?'':'s');document.getElementById('list').innerHTML=rows.length?rows.map(({x,i})=>`<article class="item" data-i="${i}"><div class="thumb ${x.type} ${previews[i]?'real':''}" style="${previews[i]?'background-image:url('+previews[i]+')':''}"><div class="scene"></div><span class="typebadge">${x.type==="photo"?"▧":x.type==="audio"?"♪":""}</span></div><div><div class="title">${x.title}</div><div class="meta">${x.who} · ${x.time} · ${x.category}</div><div class="desc">${x.desc}</div></div><div><span class="status ${x.status.toLowerCase()}">${x.status}</span><div class="chev">›</div></div></article>`).join(''):'<div class="empty">No contributions in this filter.</div>';document.querySelectorAll('.item').forEach(r=>r.onclick=()=>openItem(+r.dataset.i))}
function openItem(i){const x=items[i];document.getElementById('home').style.display='none';document.getElementById('detail').style.display='block';const hero=document.getElementById('hero');hero.className='hero '+x.type+(previews[i]?' real':'');hero.style.backgroundImage=previews[i]?'url('+previews[i]+')':'';hero.textContent=x.type==='audio'?'▂ ▅ ▃ ▇ ▄ ▆ ▂ ▅ ▇ ▃ ▆ ▄':'';document.getElementById('dtitle').textContent=x.title;const s=document.getElementById('dstatus');s.textContent=x.status;s.className='status '+x.status.toLowerCase();document.getElementById('ddesc').textContent=x.desc;document.getElementById('facts').innerHTML='<br>👤 '+x.who+'<br>🕒 '+x.time+'<br>📁 '+x.category+'<br>📎 '+x.size;document.getElementById('notice').innerHTML=x.playout?'<div class="notice"><b>✓ Delivered to Playout</b><br>The audio has been successfully ingested and is no longer stored in the Contribution Inbox.</div>':'<div class="notice"><b>Available in Contribution Inbox</b><br>Original media is retained for 7 days unless you choose Keep longer.</div>';document.getElementById('actions').innerHTML=x.playout?'<button class="wide">✓ Delivery confirmed</button><button class="wide">Mark as used</button>':'<button>▶ Play / Preview</button><button>⇩ Download original</button><button class="primary wide">Prepare for publishing</button><button>Mark as used</button><button>◷ Keep longer</button>'}
document.getElementById('back').onclick=()=>{document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block'};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});render();
</script></body></html>
